name: Build & push image (Pi self-hosted)

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
  workflow_dispatch:

env:
  IMAGE_NAME: odiin/echo-2k

jobs:
  build-and-push:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}   # "odiin"
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}         # Docker Hub access token

      - name: Build image
        run: |
          docker build \
            --file Dockerfile \
            --target prod \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${GITHUB_SHA} \
            .

      - name: Push image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${GITHUB_SHA}
